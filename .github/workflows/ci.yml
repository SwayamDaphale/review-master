name: CI/CD

# Assumes GitHub Actions + GHCR (open decision #6 in the architecture doc).
# Before the first production release, pin third-party actions to commit SHAs.
#
# Commands this workflow expects the repo to provide:
#   backend/  : ruff, mypy, pytest (marker "golden"), alembic, app.tools.export_openapi
#   frontend/ : npm scripts lint, typecheck, test, build
#   extension/: npm scripts build and scripts/check-permissions.mjs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  backend:
    name: Backend (lint, types, tests, determinism gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reviewmaster_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reviewmaster_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-only-secret
      API_KEY_PEPPER: ci-only-pepper
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy app

      - name: Migration gate (empty database -> head, then drift check)
        run: |
          alembic upgrade head
          alembic check

      - name: Unit and integration tests
        run: pytest -q -m "not golden" --cov=app --cov-report=xml

      - name: Determinism gate (golden evaluation fixtures)
        # Fixed inputs must give byte-identical scores. A changed score without
        # a new evaluation-model version fails the build.
        run: pytest -q -m golden

      - name: OpenAPI contract validity
        run: |
          python -m app.tools.export_openapi openapi.json
          pip install openapi-spec-validator
          openapi-spec-validator openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ------------------------------------------------------------------
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  # ------------------------------------------------------------------
  extension:
    name: Browser extension (build, permission gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Permission gate (no host permissions beyond the supported marketplace list)
        run: node scripts/check-permissions.mjs

  # ------------------------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm dependency audit
        run: |
          (cd frontend && npm ci && npm audit --audit-level=high)
          (cd extension && npm ci && npm audit --audit-level=high)

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ------------------------------------------------------------------
  docker:
    name: Build images (${{ matrix.service }})
    needs: [backend, frontend, extension, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: prod
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  compose-smoke:
    name: Compose smoke test (core stack)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment file
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=ci-smoke-secret/" .env
          sed -i "s/^API_KEY_PEPPER=.*/API_KEY_PEPPER=ci-smoke-pepper/" .env

      - name: Start core stack
        run: docker compose up -d --build

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz; then exit 0; fi
            sleep 3
          done
          echo "Backend did not become healthy"
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker, compose-smoke]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy image tag ${{ github.sha }}
        run: |
          echo "Replace this step with your runtime (SSH + compose, ECS, Cloud Run, Kubernetes...)."
          echo "Order: pull images -> run migrations (alembic upgrade head) -> restart api/worker/beat -> publish frontend."
      - name: Staging smoke test
        if: vars.STAGING_URL != ''
        run: curl -fsS "${{ vars.STAGING_URL }}/healthz"

  # ------------------------------------------------------------------
  deploy-production:
    name: Deploy to production (manual approval)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    # Configure required reviewers on the "production" environment in repository settings.
    environment: production
    steps:
      - name: Deploy image tag ${{ github.sha }}
        run: |
          echo "Replace this step with your production runtime. Use the same image tag that passed staging."
      - name: Production smoke test
        if: vars.PRODUCTION_URL != ''
        run: curl -fsS "${{ vars.PRODUCTION_URL }}/healthz"
