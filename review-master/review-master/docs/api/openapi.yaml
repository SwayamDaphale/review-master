openapi: 3.1.0
info:
  title: Review Master API
  version: 0.1.0-draft
  description: 'Design-stage contract skeleton generated from the architecture package. Field names and shapes are
    proposals; the backend''s generated OpenAPI becomes the source of truth once implemented. Rules: versioned under
    /api/v1; no endpoint accepts a score as input; quality, community and expert outputs stay separate; cached lookups
    target <= 2 s.'
servers:
- url: http://localhost:8000
  description: Local
tags:
- name: Health
- name: Auth
- name: Products
- name: Evaluations
- name: Evidence
- name: Community
- name: Comparison
- name: Recommendation
- name: Offers & Price
- name: User space
- name: Expert workflow
- name: Admin
- name: Developer
- name: Chat
paths:
  /healthz:
    get:
      operationId: get_healthz
      tags:
      - Health
      summary: Liveness probe
      x-required-role: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /readyz:
    get:
      operationId: get_readyz
      tags:
      - Health
      summary: Readiness probe (database, redis)
      x-required-role: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checks:
                    type: object
  /api/v1/auth/signup:
    post:
      operationId: post_api_v1_auth_signup
      tags:
      - Auth
      summary: Create account (email verification follows)
      x-required-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: &id001
                    type: string
                    format: uuid
  /api/v1/auth/verify-email:
    post:
      operationId: post_api_v1_auth_verify_email
      tags:
      - Auth
      summary: Verify email with token
      x-required-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
  /api/v1/auth/login:
    post:
      operationId: post_api_v1_auth_login
      tags:
      - Auth
      summary: Login (TOTP required for admin and expert)
      x-required-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/v1/auth/refresh:
    post:
      operationId: post_api_v1_auth_refresh
      tags:
      - Auth
      summary: Rotate refresh token, get new access token
      x-required-role: public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/v1/auth/logout:
    post:
      operationId: post_api_v1_auth_logout
      tags:
      - Auth
      summary: Revoke current session
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/users/me:
    get:
      operationId: get_api_v1_users_me
      tags:
      - Auth
      summary: Current user and roles
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/products:
    get:
      operationId: get_api_v1_products
      tags:
      - Products
      summary: Search canonical products
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - products:read
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/products/{product_id}:
    get:
      operationId: get_api_v1_products_product_id
      tags:
      - Products
      summary: Get canonical product with variants
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - products:read
      parameters:
      - name: product_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/products/identify:
    post:
      operationId: post_api_v1_products_identify
      tags:
      - Products
      summary: Identify a marketplace listing as a canonical variant
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - products:read
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/products/corrections:
    post:
      operationId: post_api_v1_products_corrections
      tags:
      - Products
      summary: Report a wrong match (goes to admin queue)
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/variants/{variant_id}:
    get:
      operationId: get_api_v1_variants_variant_id
      tags:
      - Products
      summary: Get variant with the three separate trust outputs
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - products:read
        - evaluations:read
      parameters:
      - name: variant_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/variants/{variant_id}/evaluation:
    get:
      operationId: get_api_v1_variants_variant_id_evaluation
      tags:
      - Evaluations
      summary: Latest evaluation (score, confidence, parameters, evidence refs)
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - evaluations:read
      parameters:
      - name: variant_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/variants/{variant_id}/evaluation/history:
    get:
      operationId: get_api_v1_variants_variant_id_evaluation_history
      tags:
      - Evaluations
      summary: Evaluation history with model versions
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - evaluations:read
      parameters:
      - name: variant_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/evaluations/{evaluation_id}/explanation:
    post:
      operationId: post_api_v1_evaluations_evaluation_id_explanation
      tags:
      - Evaluations
      summary: AI explanation grounded in the stored evaluation
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - evaluations:read
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/evidence:
    post:
      operationId: post_api_v1_evidence
      tags:
      - Evidence
      summary: Upload evidence (scanned before storage)
      x-required-role: admin | expert_reviewer
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvidenceUpload'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/evidence/{evidence_id}:
    get:
      operationId: get_api_v1_evidence_evidence_id
      tags:
      - Evidence
      summary: Evidence metadata and signed file URL (permission-checked)
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - evidence:read
      parameters:
      - name: evidence_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/variants/{variant_id}/feedback:
    post:
      operationId: post_api_v1_variants_variant_id_feedback
      tags:
      - Community
      summary: Submit structured feedback (moderated)
      x-required-role: public_reviewer
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - name: variant_id
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/variants/{variant_id}/community:
    get:
      operationId: get_api_v1_variants_variant_id_community
      tags:
      - Community
      summary: Community insights and review-quality signals
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - community:read
      parameters:
      - name: variant_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityInsights'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/comparisons:
    post:
      operationId: post_api_v1_comparisons
      tags:
      - Comparison
      summary: Compare same-category variants
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - comparisons:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/variants/{variant_id}/alternatives:
    get:
      operationId: get_api_v1_variants_variant_id_alternatives
      tags:
      - Comparison
      summary: Eligible alternatives with reasons
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - products:read
      parameters:
      - name: variant_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Variant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/recommendations/requirements:
    post:
      operationId: post_api_v1_recommendations_requirements
      tags:
      - Recommendation
      summary: Turn natural language into validated requirements
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - recommendations:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementsText'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requirements'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/recommendations:
    post:
      operationId: post_api_v1_recommendations
      tags:
      - Recommendation
      summary: Ranked recommendation from validated requirements
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - recommendations:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/preferences:
    get:
      operationId: get_api_v1_preferences
      tags:
      - Recommendation
      summary: Get saved preferences
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      operationId: put_api_v1_preferences
      tags:
      - Recommendation
      summary: Replace saved preferences
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/variants/{variant_id}/offers:
    get:
      operationId: get_api_v1_variants_variant_id_offers
      tags:
      - Offers & Price
      summary: Current offers (permitted sources)
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - offers:read
      parameters:
      - name: variant_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/variants/{variant_id}/price-history:
    get:
      operationId: get_api_v1_variants_variant_id_price_history
      tags:
      - Offers & Price
      summary: Price history with coverage
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth:
        - offers:read
      parameters:
      - name: variant_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/price-alerts:
    get:
      operationId: get_api_v1_price_alerts
      tags:
      - Offers & Price
      summary: List my alerts
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceAlert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: post_api_v1_price_alerts
      tags:
      - Offers & Price
      summary: Create price or target-price alert
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceAlertCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/price-alerts/{alert_id}:
    delete:
      operationId: delete_api_v1_price_alerts_alert_id
      tags:
      - Offers & Price
      summary: Delete alert
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - name: alert_id
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/saved-products:
    get:
      operationId: get_api_v1_saved_products
      tags:
      - User space
      summary: List saved products
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: post_api_v1_saved_products
      tags:
      - User space
      summary: Save a product variant
      x-required-role: any authenticated user
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/saved-products/{saved_id}:
    delete:
      operationId: delete_api_v1_saved_products_saved_id
