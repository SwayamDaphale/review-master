      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: http
      scheme: bearer
      description: 'Customer API key: rm_live_<prefix>_<secret>. Scopes are enforced per endpoint (see x-required-role
        and tags).'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Makes record-creating POST requests safe to retry (stored 24 h).
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted (role, scope or tenant)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        trace_id:
          type: string
        details:
          type: object
      required:
      - code
      - message
    ConfidenceState:
      type: string
      enum:
      - high
      - limited
      - insufficient_evidence
    MatchState:
      type: string
      enum:
      - confirmed
      - probable
      - ambiguous
      - unmatched
    RawAttribute:
      type: object
      properties:
        name:
          type: string
        raw_value:
          type: string
        source:
          type: string
          enum:
          - parser
          - llm
        source_span:
          type: object
          properties:
            start:
              type: integer
            end:
              type: integer
      required:
      - name
      - raw_value
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        display_name:
          type: string
      required:
      - email
      - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        totp_code:
          type: string
      required:
      - email
      - password
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          enum:
          - Bearer
      required:
      - access_token
      - expires_in
      - token_type
    User:
      type: object
      properties:
        id: *id001
        email:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        org_id: *id001
    Product:
      type: object
      properties:
        id: *id001
        name:
          type: string
        manufacturer:
          type: string
        category:
          type: string
        generation:
          type: string
        mpn:
          type: string
      required:
      - id
      - name
      - category
    Variant:
      type: object
      properties:
        id: *id001
        product_id: *id001
        configuration:
          type: object
        label:
          type: string
      required:
      - id
      - product_id
    ProductSearchResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
    IdentifyRequest:
      type: object
      properties:
        marketplace_key:
          type: string
        external_id:
          type: string
        url:
          type: string
          format: uri
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/RawAttribute'
      required:
      - marketplace_key
      - external_id
    IdentifyResponse:
      type: object
      properties:
        match_state:
          $ref: '#/components/schemas/MatchState'
        variant:
          $ref: '#/components/schemas/Variant'
        product:
          $ref: '#/components/schemas/Product'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        view:
          $ref: '#/components/schemas/ProductView'
      required:
      - match_state
    CorrectionRequest:
      type: object
      properties:
        listing_external_id:
          type: string
        marketplace_key:
          type: string
        suggested_variant_id: *id001
        note:
          type: string
      required:
      - listing_external_id
      - marketplace_key
    EvidenceRef:
      type: object
      properties:
        evidence_id: *id001
        source_type:
          type: string
          enum:
          - independent_test
          - expert_test
          - manufacturer
          - marketplace
          - community
          - other_authorized
        trust_tier:
          type: integer
          enum:
          - 1
          - 2
          - 3
        label:
          type: string
        observed_at: &id004
          type: string
          format: date-time
        verification_state:
          type: string
          enum:
          - unverified
          - verified
          - rejected
          - withdrawn
      required:
      - evidence_id
      - source_type
      - trust_tier
    ParameterResult:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - scored
          - not_scored
          - conflicted
        score: &id003
          type:
          - number
          - 'null'
        weight: &id002
          type: number
        is_critical:
          type: boolean
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRef'
      required:
      - key
      - status
    Confidence:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/ConfidenceState'
        score: *id002
        coverage: *id002
        reasons:
          type: array
          items:
            type: string
      required:
      - state
    Evaluation:
      type: object
      properties:
        evaluation_id: *id001
        variant_id: *id001
        model:
          type: object
          properties:
            name:
              type: string
            version:
              type: string
        overall_score: *id003
        confidence:
          $ref: '#/components/schemas/Confidence'
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterResult'
        limitations:
          type: array
          items:
            type: string
        value_signal:
          type:
          - object
          - 'null'
          description: Separate, price-dependent signal computed at read time; never part of the stored evaluation.
        created_at: *id004
      required:
      - evaluation_id
      - variant_id
      - confidence
      - parameters
    EvaluationHistory:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Evaluation'
    CommunityInsights:
      type: object
      properties:
        sample_size:
          type: integer
        themes:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              polarity:
                type: string
              count:
                type: integer
              feedback_ids:
                type: array
                items: *id001
        review_quality_signals:
          type: array
          items:
            type: object
            properties:
              signal_type:
                type: string
              strength: *id002
        ai_generated:
          type: boolean
        status:
          type: string
          enum:
          - available
          - not_enough_feedback
          - unavailable
    ExpertAssessmentSummary:
      type: object
      properties:
        status:
          type: string
          enum:
          - published
          - none
        findings:
          type: array
          items:
            type: object
        published_at: *id004
    Offer:
      type: object
      properties:
        offer_id: *id001
        seller:
          type: string
        price: *id002
        currency:
          type: string
        availability:
          type: string
        source:
          type: string
        observed_at: *id004
        stale:
          type: boolean
      required:
      - offer_id
      - price
      - currency
      - observed_at
    ProductView:
      type: object
      properties:
        evaluation:
          $ref: '#/components/schemas/Evaluation'
        community:
          $ref: '#/components/schemas/CommunityInsights'
        expert:
          $ref: '#/components/schemas/ExpertAssessmentSummary'
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
      description: Three trust outputs are separate and never blended into one number.
    Explanation:
      type: object
      properties:
        text:
          type: string
        ai_generated:
          type: boolean
        referenced_parameters:
          type: array
          items:
            type: string
        mode:
          type: string
          enum:
          - ai
          - template
        trace_id:
          type: string
      required:
      - text
      - ai_generated
    PricePoint:
      type: object
      properties:
        observed_at: *id004
        price: *id002
        currency:
          type: string
        source:
          type: string
    PriceHistory:
      type: object
      properties:
        windows:
          type: object
        coverage_days:
          type: integer
        points:
          type: array
          items:
            $ref: '#/components/schemas/PricePoint'
    FeedbackCreate:
      type: object
      properties:
        ratings:
          type: object
        issues:
          type: array
          items:
            type: string
        usage_context:
          type: string
        body:
          type: string
      required:
      - ratings
    Feedback:
      type: object
      properties:
        id: *id001
        variant_id: *id001
        state:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - flagged
        ratings:
          type: object
        body:
          type: string
        created_at: *id004
    ModerationDecision:
      type: object
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
          - flag
        reason:
          type: string
      required:
      - decision
    ComparisonRequest:
      type: object
      properties:
        variant_ids:
          type: array
          items: *id001
          minItems: 2
          maxItems: 5
      required:
      - variant_ids
    ComparisonResult:
      type: object
      properties:
        category:
          type: string
        rows:
          type: array
          items:
            type: object
        summary:
          $ref: '#/components/schemas/Explanation'
    RequirementsText:
      type: object
      properties:
        text:
          type: string
          maxLength: 2000
      required:
      - text
    Requirements:
      type: object
      properties:
        category:
          type:
          - string
          - 'null'
        hard:
          type: object
        preferences:
          type: object
        use_case:
          type:
          - string
          - 'null'
        clarifications_needed:
          type: array
          items:
            type: string
      required:
      - hard
      - preferences
      - clarifications_needed
    RecommendationRequest:
      type: object
      properties:
        requirements:
          $ref: '#/components/schemas/Requirements'
      required:
      - requirements
    RecommendationResult:
      type: object
      properties:
        ranked:
          type: array
          items:
            type: object
            properties:
              variant_id: *id001
              fit_score: *id002
              confidence_factor: *id002
              confidence:
                $ref: '#/components/schemas/ConfidenceState'
              constraints_passed:
                type: array
                items:
                  type: string
        rejected:
          type: array
          items:
            type: object
            properties:
              variant_id: *id001
              failed_constraint:
                type: string
        suggested_relaxation:
          type:
          - object
          - 'null'
        explanation:
          $ref: '#/components/schemas/Explanation'
    SavedProduct:
      type: object
      properties:
        id: *id001
        variant_id: *id001
        created_at: *id004
    SaveRequest:
      type: object
      properties:
        variant_id: *id001
      required:
      - variant_id
    PriceAlertCreate:
      type: object
      properties:
        variant_id: *id001
        kind:
          type: string
          enum:
          - drop
          - target
        target_price: *id002
      required:
      - variant_id
      - kind
    PriceAlert:
      type: object
      properties:
        id: *id001
        variant_id: *id001
        kind:
          type: string
        target_price: *id003
        active:
          type: boolean
    NotificationSetting:
      type: object
      properties:
        type:
          type: string
        channel:
          type: string
          enum:
          - in_app
          - email
          - browser
          - mobile
        enabled:
          type: boolean
      required:
      - type
      - channel
      - enabled
    NotificationSettings:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationSetting'
    EvidenceUpload:
      type: object
      properties:
        variant_id: *id001
        parameter_key:
          type: string
        source_type:
          type: string
        methodology:
          type: string
        file:
          type: string
          format: binary
      required:
      - variant_id
      - parameter_key
      - source_type
      - file
    Evidence:
      type: object
      properties:
        evidence_id: *id001
        version:
          type: integer
        scan_status:
          type: string
        ref:
          $ref: '#/components/schemas/EvidenceRef'
    ExpertCaseCreate:
      type: object
      properties:
        variant_id: *id001
        reason:
          type: string
        evidence_ids:
          type: array
          items: *id001
      required:
      - variant_id
      - reason
    ExpertCase:
      type: object
      properties:
        id: *id001
        variant_id: *id001
        state:
          type: string
        created_at: *id004
    AssignRequest:
      type: object
      properties:
        expert_id: *id001
      required:
      - expert_id
    AssessmentSubmit:
      type: object
      properties:
        methodology:
          type: string
        test_conditions:
          type: string
        findings:
          type: array
          items:
            type: object
        limitations:
          type: string
        conflict_declaration:
          type: object
      required:
      - methodology
      - findings
    AssessmentReview:
      type: object
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
          - return
        comments:
          type: string
      required:
      - decision
    MappingQueueItem:
      type: object
      properties:
        id: *id001
        listing_id: *id001
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        reason:
          type: string
    MappingResolution:
      type: object
      properties:
        action:
          type: string
          enum:
          - confirm
          - change
          - split
        variant_id: *id001
      required:
      - action
    EvaluationModelVersionCreate:
      type: object
      properties:
        definition:
          type: object
      required:
      - definition
    EvaluationModelVersion:
      type: object
      properties:
        id: *id001
        model:
          type: string
        version:
          type: string
        status:
          type: string
          enum:
          - draft
          - review
          - published
          - retired
        published_at: *id004
    AuditEntry:
      type: object
      properties:
        id: *id001
        actor_id: *id001
        action:
          type: string
        object_type:
          type: string
        object_id: *id001
        occurred_at: *id004
        trace_id:
          type: string
    Integration:
      type: object
      properties:
        marketplace:
          type: string
        status:
          type: string
        last_sync_at: *id004
        freshness_seconds:
          type: integer
        last_error:
          type: string
    ApiKeyCreate:
      type: object
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at: *id004
      required:
      - name
      - scopes
    ApiKey:
      type: object
      properties:
        id: *id001
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        last_used_at: *id004
        expires_at: *id004
    ApiKeyCreated:
      allOf:
      - $ref: '#/components/schemas/ApiKey'
      - type: object
        properties:
          secret:
            type: string
            description: Shown once, never retrievable again.
        required:
        - secret
    WebhookCreate:
      type: object
      properties:
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
      required:
      - url
      - event_types
    Webhook:
      type: object
      properties:
        id: *id001
        url:
          type: string
        event_types:
          type: array
          items:
            type: string
        secret:
          type: string
          description: Returned once on creation.
    AdminUser:
      type: object
      properties:
        id: *id001
        email:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
          - deleted
        roles:
          type: array
          items:
            type: string
        mfa_enabled:
          type: boolean
    AdminUserList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        next_cursor:
          type: string
    RoleUpdate:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
            enum:
            - consumer
            - public_reviewer
            - expert_reviewer
            - admin
            - api_consumer
            - brand
        reason:
          type: string
      required:
      - roles
    EvaluationModelCreate:
      type: object
      properties:
        category_key:
          type: string
        name:
          type: string
      required:
      - category_key
      - name
    EvaluationModel:
      type: object
      properties:
        id: *id001
        category_key:
          type: string
        name:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationModelVersion'
    EvidenceVersion:
      type: object
      properties:
        version:
          type: integer
        observed_at: *id004
        verification_state:
          type: string
        created_by: *id001
        withdrawn_at: *id004
    EvidenceVersions:
      type: object
      properties:
        evidence_id: *id001
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceVersion'
    WebhookDelivery:
      type: object
      properties:
        id: *id001
        event_id:
          type: string
        attempt:
          type: integer
        status_code:
          type: integer
        state:
          type: string
          enum:
          - pending
          - delivered
          - retrying
          - failed
        next_retry_at: *id004
    ChatRequest:
      type: object
      properties:
        conversation_id: *id001
        message:
          type: string
          maxLength: 2000
        confirm_action_token:
          type: string
      required:
      - message
    ChatResponse:
      type: object
      properties:
        conversation_id: *id001
        answer:
          $ref: '#/components/schemas/Explanation'
        pending_confirmation:
          type:
          - object
          - 'null'
        unavailable_sections:
          type: array
          items:
            type: string
