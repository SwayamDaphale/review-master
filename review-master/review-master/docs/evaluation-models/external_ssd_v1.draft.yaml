# DRAFT evaluation model - NOT FOR PUBLICATION
# Parameter names come from the Master Project Capsule section 17 ("starting design examples,
# not final production weights"). Everything marked `proposed` is a suggestion for domain experts
# to confirm or replace. `null` means "must be decided before this model can be published".
# The publish endpoint must reject a model where any weight/threshold is null or weights do not sum to 1.0.
model: external_ssd
version: 1-draft
status: draft
approvals:
  domain_expert: null
  engineering: null
  approved_at: null
weights_must_sum_to: 1.0
notes: Parameter list from capsule section 17. Inputs, critical flags and rule types are proposals.
quality_parameters:
- key: sequential_rw
  name: Sequential read/write
  definition: Peak sequential speeds.
  weight: null
  critical:
    proposed: true
  inputs:
  - seq_read_mbps
  - seq_write_mbps
  scoring_rule:
    type: linear_range
    thresholds: null
  evidence_requirements:
    min_trust_tier_to_score: 2
    preferred_source: independent_test
    max_age_days: null
- key: sustained_write
  name: Sustained write
  definition: Write speed after cache is exhausted.
  weight: null
  critical:
    proposed: true
  inputs:
  - sustained_write_mbps
  - post_cache_drop_ratio
  scoring_rule:
    type: linear_range
    thresholds: null
  evidence_requirements:
    min_trust_tier_to_score: 2
    preferred_source: independent_test
    max_age_days: null
- key: capacity
  name: Capacity
  definition: Usable capacity.
  weight: null
  critical:
    proposed: true
  inputs:
  - capacity_gb
  scoring_rule:
    type: piecewise
    thresholds: null
  evidence_requirements:
    min_trust_tier_to_score: 2
    preferred_source: manufacturer_or_marketplace_spec_ok
    max_age_days: null
- key: interface_compat
  name: Interface and compatibility
  definition: Connection standard and host compatibility.
  weight: null
  critical:
    proposed: false
  inputs:
  - usb_standard
  - protocol
  - os_compatibility
  scoring_rule:
    type: ordinal
    thresholds: null
  evidence_requirements:
    min_trust_tier_to_score: 2
    preferred_source: manufacturer_or_marketplace_spec_ok
    max_age_days: null
- key: durability_thermal
  name: Durability and thermal
  definition: Drop/ingress rating and throttling behaviour.
  weight: null
  critical:
    proposed: false
  inputs:
  - ip_rating
  - drop_rating_m
  - throttle_temp_c
  scoring_rule:
    type: ordinal
    thresholds: null
  evidence_requirements:
    min_trust_tier_to_score: 2
    preferred_source: independent_test
    max_age_days: null
- key: warranty_endurance
  name: Warranty and endurance
  definition: Warranty length and rated endurance.
  weight: null
  critical:
    proposed: false
  inputs:
  - warranty_years
  - tbw
  scoring_rule:
    type: piecewise
    thresholds: null
  evidence_requirements:
    min_trust_tier_to_score: 2
    preferred_source: manufacturer_or_marketplace_spec_ok
    max_age_days: null
- key: portability_build
  name: Portability and build
  definition: Size, weight, enclosure.
  weight: null
  critical:
    proposed: false
  inputs:
  - weight_g
  - dimensions_mm
  - enclosure_material
  scoring_rule:
    type: piecewise
    thresholds: null
  evidence_requirements:
    min_trust_tier_to_score: 2
    preferred_source: manufacturer_or_marketplace_spec_ok
    max_age_days: null
derived_signals:
- key: value
  name: Value
  kind: derived_price_signal
  excluded_from_quality_score: true
  definition: 'Quality relative to current/median offer price. Computed at read time from the quality score and
    offers; NEVER stored inside an evaluation row. (Proposal pending decision #2 in architecture section 12.)'
confidence_policy:
  coverage_floor: 0.4
  bands:
    high_min: 0.75
    limited_min: 0.45
  component_weights:
    coverage: 0.35
    source_quality: 0.25
    verification: 0.15
    freshness: 0.15
    consistency: 0.1
  tier_factors:
    '1': 1.0
    '2': 0.6
    '3': 0.3
  high_confidence_min_tier1_share: 0.3
  freshness_half_life_days:
    manufacturer_spec: null
    independent_test: null
    marketplace: null
    community: null
  note: All values are heuristic starting points from the architecture document; calibrate on the reviewed test
    set.
publish_checklist:
- all weights set and sum to 1.0
- all scoring thresholds set and documented with a rationale
- evidence requirements and max ages set per parameter
- critical parameters confirmed by a domain expert
- calibrated against the manually reviewed test set
- sensitivity analysis done (rank stability under weight changes)
- golden evaluation fixtures added to CI
- explicit approval recorded (domain expert + engineering)
